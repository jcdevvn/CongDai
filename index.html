 4 đáp án\",\n                title: \"2. Dựa vào tỉ lệ carbon, kim loại đen được chia thành hai loại chính là gì?\",\n                options: [\"Gang và đồng\", \"Thép và gang\", \"Thép và hợp kim nhôm\", \"Gang và inox\"],\n                answer: 1,\n                explanation: \"Dựa vào tỉ lệ carbon (gang > 2,14% và thép <= 2,14%), kim loại đen chia thành thép và gang.\"\n            },\n            {\n                type: \"Trắc nghiệm 4 đáp án\",\n                title: \"3. Trong công thức tỉ số truyền của bộ truyền động đai i = n₁ / n₂ = D₂ / D₁, kí hiệu D₁, D₂ lần lượt là gì?\",\n                options: [\"Đường kính bánh dẫn và đường kính bánh bị dẫn\", \"Số răng của bánh dẫn và bánh bị dẫn\", \"Tốc độ quay bánh dẫn và bánh bị dẫn\", \"Chiều dài và chiều rộng dây đai\"],\n                answer: 0,\n                explanation: \"Theo SGK trang 38, D₁ là đường kính bánh dẫn, D₂ là đường kính bánh bị dẫn.\"\n            },\n            {\n                type: \"Trắc nghiệm 4 đáp án\",\n                title: \"4. Công thức tính tỉ số truyền i của bộ truyền động ăn khớp (bánh răng) theo số răng Z₁, Z₂ là gì?\",\n                options: [\"i = Z₁ / Z₂\", \"i = Z₂ / Z₁\", \"i = Z₁ × Z₂\", \"i = Z₁ + Z₂\"],\n                answer: 1,\n                explanation: \"Tỉ số truyền bánh răng được tính theo công thức: i = n₁ / n₂ = Z₂ / Z₁.\"\n            },\n            {\n                type: \"Trắc nghiệm 4 đáp án\",\n                title: \"5. Cơ cấu nào sau đây biến chuyển động quay thành chuyển động tịnh tiến (và ngược lại)?\",\n                options: [\"Cơ cấu tay quay thanh lắc\", \"Cơ cấu tay quay con trượt\", \"Bộ truyền động đai\", \"Bộ truyền động xích\"],\n                answer: 1,\n                explanation: \"Cơ cấu tay quay con trượt biến chuyển động quay thành chuyển động tịnh tiến và ngược lại.\"\n            },\n            {\n                type: \"Trắc nghiệm 4 đáp án\",\n                title: \"6. Dụng cụ nào sau đây dùng để đo đường kính trong, đường kính ngoài và chiều sâu lỗ với độ chính xác cao?\",\n                options: [\"Thước lá\", \"Thước cuộn\", \"Thước cặp\", \"Mũi vạch\"],\n                answer: 2,\n                explanation: \"Thước cặp có độ chính xác từ 0,1 đến 0,02 mm, dùng để đo đường kính trong, ngoài và chiều sâu lỗ.\"\n            },\n            {\n                type: \"Trắc nghiệm 4 đáp án\",\n                title: \"7. Trong quá trình cưa kim loại bằng tay, khi đẩy cưa cần thực hiện thao tác thế nào?\",\n                options: [\"Đẩy nhanh và không ấn\", \"Ấn lưỡi cưa và đẩy chậm để tạo lực cắt\", \"Không ấn và kéo thật mạnh\", \"Đẩy nhanh và ấn hết sức\"],\n                answer: 1,\n                explanation: \"Khi đẩy cưa thì ấn lưỡi cưa và đẩy chậm để tạo lực cắt.\"\n            },\n            {\n                type: \"Trắc nghiệm 4 đáp án\",\n                title: \"8. Ngành nghề nào sau đây THUỘC lĩnh vực cơ khí theo danh mục tại SGK Công nghệ 8?\",\n                options: [\"Kỹ sư nông nghiệp\", \"Kỹ sư cơ khí\", \"Kỹ sư hóa học\", \"Kỹ sư xây dựng cầu đường\"],\n                answer: 1,\n                explanation: \"Kỹ sư cơ khí là ngành nghề phổ biến thuộc lĩnh vực cơ khí.\"\n            },\n            {\n                type: \"Trắc nghiệm 4 đáp án\",\n                title: \"9. Chất dẻo được chia làm mấy loại chính trong kỹ thuật cơ khí?\",\n                options: [\"1 loại\", \"2 loại (chất dẻo nhiệt và chất dẻo nhiệt rắn)\", \"3 loại\", \"4 loại\"],\n                answer: 1,\n                explanation: \"Chất dẻo chia làm hai loại: chất dẻo nhiệt và chất dẻo nhiệt rắn.\"\n            },\n            {\n                type: \"Trắc nghiệm 4 đáp án\",\n                title: \"10. Khi đục kim loại, góc nghiêng chuẩn giữa thân đục và mặt phẳng nằm ngang là bao nhiêu độ?\",\n                options: [\"10 đến 15 độ\", \"30 đến 35 độ\", \"60 đến 75 độ\", \"90 độ\"],\n                answer: 1,\n                explanation: \"Nâng đục sao cho đục nghiêng so với mặt phẳng nằm ngang một góc 30 đến 35 độ.\"\n            },\n            {\n                type: \"Trắc nghiệm 4 đáp án\",\n                title: \"11. Bộ truyền động xích ứng dụng cấu phần nào để truyền chuyển động giữa hai trục cách xa nhau?\",\n                options: [\"Dây đai da thuộc\", \"Xích và đĩa xích ăn khớp\", \"Bánh răng trung gian\", \"Trục khuỷu pít-tông\"],\n                answer: 1,\n                explanation: \"Truyền động xích dùng đĩa dẫn, đĩa bị dẫn và xích ăn khớp.\"\n            },\n            {\n                type: \"Trắc nghiệm 4 đáp án\",\n                title: \"12. Cơ cấu tay quay thanh lắc có đặc điểm gì về chuyển động của các chi tiết?\",\n                options: [\"Biến chuyển động quay thành tịnh tiến\", \"Biến chuyển động quay thành chuyển động lắc qua lại\", \"Biến chuyển động tịnh tiến thành quay tròn đều\", \"Truyền động ma sát dây đai\"],\n                answer: 1,\n                explanation: \"Cơ cấu tay quay thanh lắc biến chuyển động quay thành chuyển động lắc qua lại quanh trục.\"\n            },\n            {\n                type: \"Đúng / Sai\",\n                title: \"13. Nhận định sau Đúng hay Sai? 'Gang có tỉ lệ carbon lớn hơn 2,14% và có tính cứng, giòn.'\",\n                options: [\"Đúng\", \"Sai\", \"Không xác định\", \"Chưa đủ cơ sở\"],\n                answer: 0,\n                explanation: \"Đúng. Gang là kim loại đen có tỉ lệ carbon > 2,14%, đặc điểm cứng, giòn, không thể dát mỏng.\"\n            },\n            {\n                type: \"Đúng / Sai\",\n                title: \"14. Nhận định sau Đúng hay Sai? 'Trong bộ truyền động đai, bánh đai nào có đường kính lớn hơn sẽ quay với tốc độ lớn hơn.'\",\n                options: [\"Đúng\", \"Sai\", \"Tùy thuộc vào dây đai\", \"Cả hai quay bằng nhau\"],\n                answer: 1,\n                explanation: \"Sai. Bánh đai nào có đường kính nhỏ hơn sẽ quay nhanh hơn theo công thức i = D₂ / D₁.\"\n            },\n            {\n                type: \"Đúng / Sai\",\n                title: \"15. Nhận định sau Đúng hay Sai? 'Thước lá dùng để đo độ dài chi tiết có độ chính xác tuyệt đối đến 0,001 mm.'\",\n                options: [\"Đúng\", \"Sai\", \"Tùy loại thước\", \"Chính xác một nửa\"],\n                answer: 1,\n                explanation: \"Sai. Thước lá có các vạch cách nhau 1 mm, dùng đo thông thường; thước cặp mới có độ chính xác cao (0,1 - 0,02 mm).\"\n            },\n            {\n                type: \"Đúng / Sai\",\n                title: \"16. Nhận định sau Đúng hay Sai? 'Mô hình xi lanh - pít-tông ứng dụng nguyên lý của cơ cấu tay quay con trượt.'\",\n                options: [\"Đúng\", \"Sai\", \"Không phải\", \"Ứng dụng truyền động đai\"],\n                answer: 0,\n                explanation: \"Đúng. Xi lanh - pít-tông là ứng dụng thực tế của cơ cấu tay quay con trượt.\"\n            },\n            {\n                type: \"Đúng / Sai\",\n                title: \"17. Nhận định sau Đúng hay Sai? 'Khi cưa gần đứt phôi, ta phải đẩy cưa thật mạnh và nhanh để cắt lìa ngay lập tức.'\",\n                options: [\"Đúng\", \"Sai\", \"Không quan trọng\", \"Cần ấn mạnh hơn nữa\"],\n                answer: 1,\n                explanation: \"Sai. Khi cưa gần đứt phải đẩy cưa nhẹ hơn và đỡ vật tránh rơi vào chân.\"\n            },\n            {\n                type: \"Câu hỏi ngắn\",\n                title: \"18. Điền từ thích hợp: Thành phần chủ yếu của kim loại đen là sắt và ...\",\n                options: [\"Carbon\", \"Nhôm\", \"Đồng\", \"Kẽm\"],\n                answer: 0,\n                explanation: \"Thành phần chủ yếu của kim loại đen là sắt và carbon.\"\n            },\n            {\n                type: \"Câu hỏi ngắn\",\n                title: \"19. Tên gọi của cơ cấu biến đổi chuyển động quay thành chuyển động tịnh tiến qua lại gồm tay quay, thanh truyền và ...\",\n                options: [\"Con trượt\", \"Thanh lắc\", \"Đĩa xích\", \"Vô lăng\"],\n                answer: 0,\n                explanation: \"Cơ cấu tay quay con trượt gồm tay quay, thanh truyền, con trượt và giá đỡ.\"\n            },\n            {\n                type: \"Câu hỏi ngắn\",\n                title: \"20. Dụng cụ gia công cơ khí cầm tay dùng để kẹp chặt phôi khi gia công (như cưa, đục, dũa) được gọi là gì?\",\n                options: [\"Ê tô\", \"Kìm cắt\", \"Búa tạ\", \"Mỏ lết\"],\n                answer: 0,\n                explanation: \"Ê tô dùng để kẹp chặt phôi khi gia công cơ khí bằng tay.\"\n            },\n            {\n                type: \"Câu hỏi ngắn\",\n                title: \"21. Vật liệu phi kim loại nào phổ biến có tính đàn hồi cao, giảm chấn tốt, thường làm săm lốp xe?\",\n                options: [\"Cao su\", \"Chất dẻo nhiệt\", \"Thủy tinh\", \"Gốm\"],\n                answer: 0,\n                explanation: \"Cao su là vật liệu phi kim loại có tính đàn hồi cao, dùng làm săm lốp.\"\n            },\n            {\n                type: \"Câu hỏi ngắn\",\n                title: \"22. Trong bộ truyền động bánh răng, bánh răng có số răng ít hơn thì sẽ quay với tốc độ như thế nào so với bánh nhiều răng?\",\n                options: [\"Quay nhanh hơn\", \"Quay chậm hơn\", \"Quay tốc độ bằng nhau\", \"Không quay được\"],\n                answer: 0,\n                explanation: \"Bánh răng nào có số răng ít hơn thì sẽ quay nhanh hơn.\"\n            },\n            {\n                type: \"Bài tập tính toán\",\n                title: \"23. Bài tập tính toán: Cho bộ truyền động đai có bánh dẫn 1 có đường kính D₁ = 100 mm quay với tốc độ n₁ = 600 vòng/phút. Bánh bị dẫn 2 có đường kính D₂ = 300 mm. Tính tốc độ quay n₂ của bánh bị dẫn.\",\n                options: [\"200 vòng/phút\", \"600 vòng/phút\", \"1800 vòng/phút\", \"300 vòng/phút\"],\n                answer: 0,\n                explanation: \"Áp dụng công thức i = n₁ / n₂ = D₂ / D₁ => n₂ = n₁ × (D₁ / D₂) = 600 × (100 / 300) = 200 vòng/phút.\"\n            },\n            {\n                type: \"Bài tập tính toán\",\n                title: \"24. Bài tập tính toán: Một cặp bánh răng ăn khớp có số răng của bánh dẫn Z₁ = 20 răng, bánh bị dẫn Z₂ = 60 răng. Bánh dẫn quay với tốc độ n₁ = 300 vòng/phút. Tính tốc độ quay n₂ của bánh bị dẫn.\",\n                options: [\"100 vòng/phút\", \"300 vòng/phút\", \"900 vòng/phút\", \"50 vòng/phút\"],\n                answer: 0,\n                explanation: \"Theo công thức i = n₁ / n₂ = Z₂ / Z₁ => n₂ = n₁ × (Z₁ / Z₂) = 300 × (20 / 60) = 100 vòng/phút.\"\n            },\n            {\n                type: \"Vận dụng\",\n                title: \"25. Khi dũa chi tiết cơ khí, nếu người thợ không giữ được dũa thăng bằng thì bề mặt dũa sẽ có hiện tượng gì?\",\n                options: [\"Bề mặt dũa bị phẳng mịn tuyệt đối\", \"Bề mặt dũa bị lồi lõm, không phẳng\", \"Dũa sẽ sắc bén hơn\", \"Không ảnh hưởng gì\"],\n                answer: 1,\n                explanation: \"Nếu không giữ dũa thăng bằng, lực ấn không đều sẽ khiến bề mặt gia công bị lồi lõm.\"\n            },\n            {\n                type: \"Vận dụng\",\n                title: \"26. Tại sao khi cưa gần đứt phôi, người thợ phải giảm lực đẩy và đẩy cưa nhẹ hơn?\",\n                options: [\"Để tiết kiệm sức lực\", \"Tránh làm gãy lưỡi cưa và tránh vật rơi đột ngột gây tai nạn\", \"Để mạt cưa không bắn ra ngoài\", \"Để tăng tốc độ cắt\"],\n                answer: 1,\n                explanation: \"Cưa gần đứt phôi rất dễ làm gãy lưỡi cưa hoặc rơi vật gây nguy hiểm, cần thao tác nhẹ nhàng.\"\n            },\n            {\n                type: \"Vận dụng\",\n                title: \"27. Bộ phận nào trong máy khâu đạp chân minh họa cho ứng dụng của cơ cấu tay quay thanh lắc?\",\n                options: [\"Bàn đạp và vô lăng dẫn\", \"Kim khâu và suốt chỉ\", \"Bánh răng truyền động\", \"Dây đai dẹt\"],\n                answer: 0,\n                explanation: \"Máy khâu đạp chân kết hợp cơ cấu tay quay thanh lắc (bàn đạp gắn với thanh truyền và vô lăng).\"\n            },\n            {\n                type: \"Vận dụng\",\n                title: \"28. Inox (thép không gỉ) ngoài sắt và carbon còn chứa các thành phần kim loại màu quan trọng nào?\",\n                options: [\"Chromium, nickel, manganese\", \"Chỉ có nhôm và kẽm\", \"Chỉ có đồng đỏ\", \"Chỉ có chì và thủy ngân\"],\n                answer: 0,\n                explanation: \"Theo SGK trang 35, thành phần inox gồm sắt, carbon và chromium, nickel, manganese...\"\n            },\n            {\n                type: \"Vận dụng\",\n                title: \"29. Khi thực hiện vạch dấu trên phôi kim loại, thao tác đầu tiên và quan trọng nhất cần làm là gì?\",\n                options: [\"Bôi lớp màu lên bề mặt phôi để nét vạch rõ nét\", \"Dùng búa tạ đập bẹt phôi\", \"Sử dụng thước cặp đo nhiệt độ\", \"Nhúng phôi vào nước\"],\n                answer: 0,\n                explanation: \"Kỹ thuật vạch dấu cần chuẩn bị phôi, bôi phần màu lên bề mặt phôi rồi mới dùng mũi vạch.\"\n            },\n            {\n                type: \"Vận dụng\",\n                title: \"30. Yêu cầu quan trọng nhất đối với người lao động khi làm việc trong lĩnh vực cơ khí là gì?\",\n                options: [\"Tuân thủ tuyệt đối an toàn lao động và có sức khỏe tốt\", \"Biết hát và vẽ tranh nghệ thuật\", \"Biết nấu ăn giỏi\", \"Biết ngoại ngữ lưu loát\"],\n                answer: 0,\n                explanation: \"Môi trường cơ khí khắc nghiệt đòi hỏi tuân thủ tuyệt đối an toàn lao động và sức khỏe tốt.\"\n            }\n        ];\n\n        let currentQuestions = [];\n        let currentIndex = 0;\n        let userAnswers = {}; // Lưu đáp án học sinh đã chọn: { qIndex: optIndex }\n        let timerInterval = null;\n        let timeLeft = 15 * 60; // 15 phút = 900 giây\n        let studentInfo = { name: '', class: '', code: '1' };\n\n        // Đổi màu nền giao diện\n        function changeTheme(theme) {\n            const app = document.getElementById('app');\n            if(theme === 'blue') {\n                document.body.className = \"bg-blue-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-slate-900\";\n            } else if(theme === 'emerald') {\n                document.body.className = \"bg-emerald-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-slate-900\";\n            } else {\n                document.body.className = \"bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-slate-900\";\n            }\n        }\n\n        // Bắt đầu bài kiểm tra\n        function startQuiz() {\n            if(localStorage.getItem('cog_nghe_8_submitted') === 'true') {\n                alert(\"⚠️ Bạn đã làm bài kiểm tra này rồi. Hệ thống khóa lượt thi duy nhất.\");\n                return;\n            }\n\n            const name = document.getElementById('input-name').value.trim();\n            const clazz = document.getElementById('input-class').value.trim();\n            const code = document.getElementById('select-madet').value;\n            const errBox = document.getElementById('welcome-error');\n\n            if(!name || !clazz) {\n                errBox.innerText = \"⚠️ Vui lòng nhập đầy đủ Họ và tên và Lớp trước khi bắt đầu!\";\n                errBox.classList.remove('hidden');\n                return;\n            }\n\n            studentInfo = { name, class: clazz, code };\n\n            // Chuẩn bị câu hỏi (nếu mã đề 2 thì xáo trộn nhẹ)\n            currentQuestions = JSON.parse(JSON.stringify(bankQuestionsCode));\n            if(code === '2') {\n                // Đảo thứ tự câu hỏi hoặc xáo trộn\n                currentQuestions.sort(() => Math.random() - 0.5);\n            }\n\n            document.getElementById('screen-welcome').classList.add('hidden');\n            document.getElementById('screen-quiz').classList.remove('hidden');\n\n            loadQuestion(0);\n            startTimer();\n        }\n\n        // Đồng hồ đếm ngược\n        function startTimer() {\n            timerInterval = setInterval(() => {\n                timeLeft--;\n                let m = Math.floor(timeLeft / 60);\n                let s = timeLeft % 60;\n                document.getElementById('timer-display').innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;\n                \n                if(timeLeft <= 0) {\n                    clearInterval(timerInterval);\n                    alert(\"⏰ Hết thời gian làm bài! Hệ thống sẽ tự động nộp bài.\");\n                    submitQuizFinal();\n                }\n            }, 1000);\n        }\n\n        // Tải câu hỏi lên giao diện\n        function loadQuestion(index) {\n            const q = currentQuestions[index];\n            document.getElementById('question-index').innerText = `Câu số ${index + 1} / ${currentQuestions.length}`;\n            document.getElementById('question-type-tag').innerText = q.type;\n            document.getElementById('question-title').innerText = q.title;\n\n            // Thanh tiến trình\n            const progressPercent = ((index + 1) / currentQuestions.length) * 100;\n            document.getElementById('progress-bar').style.width = `${progressPercent}%`;\n            document.getElementById('progress-text').innerText = `${index + 1}/${currentQuestions.length}`;\n\n            // Kiểm tra xem câu này đã được chọn trước đó chưa\n            const isAnswered = userAnswers[index] !== undefined;\n\n            // Render options\n            const container = document.getElementById('options-container');\n            container.innerHTML = \"\";\n\n            q.options.forEach((opt, optIdx) => {\n                const isSelected = userAnswers[index] === optIdx;\n                const btn = document.createElement('button');\n                \n                // Style cho nút\n                let btnClass = 'w-full text-left p-4 rounded-xl border transition flex items-center justify-between font-medium text-sm sm:text-base ';\n                if(isAnswered) {\n                    if(isSelected) {\n                        btnClass += opt === q.options[q.answer] ? 'bg-emerald-600/30 border-emerald-500 text-white shadow-md' : 'bg-rose-600/30 border-rose-500 text-white shadow-md';\n                    } else if(optIdx === q.answer) {\n                        btnClass += 'bg-emerald-900/40 border-emerald-600/60 text-emerald-200';\n                    } else {\n                        btnClass += 'bg-slate-900/40 border-slate-800 text-slate-500 opacity-50';\n                    }\n                } else {\n                    btnClass += 'bg-slate-900/60 border-slate-700 hover:border-slate-500 text-slate-200';\n                }\n\n                btn.className = btnClass;\n                \n                let letter = String.fromCharCode(65 + optIdx); // A, B, C, D\n                btn.innerHTML = `\n                    <div class=\"flex items-center space-x-3\">\n                        <span class=\"w-8 h-8 rounded-lg flex items-center justify-center font-bold text-xs ${isSelected ? (opt === q.options[q.answer] ? 'bg-emerald-500 text-white' : 'bg-rose-500 text-white') : 'bg-slate-800 text-slate-300 border border-slate-600'}\">${letter}<\/span>\n                        <span>${opt}<\/span>\n                    <\/div>\n                    ${isSelected ? '<span class=\"text-xs font-semibold\">Đã chọn ✓<\/span>' : ''}\n                `;\n\n                // Xử lý sự kiện chọn đáp án (chỉ cho phép chọn 1 lần duy nhất)\n                if(!isAnswered) {\n                    btn.onclick = () => selectOption(index, optIdx);\n                } else {\n                    btn.onclick = () => handleSecondChoiceAttempt(index, optIdx);\n                }\n                container.appendChild(btn);\n            });\n\n            // Xử lý hiển thị phản hồi nếu câu hỏi này đã được trả lời trước đó\n            const feedbackBox = document.getElementById('feedback-box');\n            if(isAnswered) {\n                showFeedback(index, userAnswers[index]);\n            } else {\n                feedbackBox.classList.add('hidden');\n            }\n\n            // Nút chuyển câu\n            document.getElementById('btn-prev').disabled = index === 0;\n            const btnNext = document.getElementById('btn-next');\n            if(index === currentQuestions.length - 1) {\n                btnNext.innerText = \"Hoàn thành ➔\";\n            } else {\n                btnNext.innerText = \"Câu tiếp →\";\n            }\n        }\n\n        // Chọn đáp án lần đầu\n        function selectOption(qIdx, optIdx) {\n            userAnswers[qIdx] = optIdx;\n            loadQuestion(qIdx);\n            showFeedback(qIdx, optIdx);\n        }\n\n        // Xử lý khi học sinh cố gắng chọn lần thứ hai cho cùng một câu hoặc đổi ý\n        function handleSecondChoiceAttempt(qIdx, optIdx) {\n            alert(\"⚠️ Theo quy chế bài kiểm tra, học sinh CHỈ ĐƯỢC PHÉP CHỌN MỘT LƯỢT DUY NHẤT cho mỗi câu hỏi. Bạn đã khóa đáp án này rồi và bài kiểm tra sẽ tự động nộp khóa bài do vi phạm thao tác!\");\n            submitQuizFinal();\n        }\n\n        // Hiển thị phản hồi tích cực và giải thích ngắn gọn ngay sau khi chọn\n        function showFeedback(qIdx, optIdx) {\n            const q = currentQuestions[qIdx];\n            const feedbackBox = document.getElementById('feedback-box');\n            const feedbackHeader = document.getElementById('feedback-header');\n            const feedbackContent = document.getElementById('feedback-content');\n\n            feedbackBox.classList.remove('hidden');\n            const isCorrect = optIdx === q.answer;\n\n            if(isCorrect) {\n                feedbackBox.className = \"p-4 rounded-xl mb-6 border bg-emerald-950/50 border-emerald-600 text-emerald-200 text-sm transition\";\n                feedbackHeader.innerHTML = `<span>✨ Chính xác! Tuyệt vời lắm.<\/span>`;\n            } else {\n                feedbackBox.className = \"p-4 rounded-xl mb-6 border bg-rose-950/50 border-rose-600 text-rose-200 text-sm transition\";\n                feedbackHeader.innerHTML = `<span>💡 Chưa chính xác. Đáp án đúng là: <strong class=\"text-white\">${String.fromCharCode(65 + q.answer)}. ${q.options[q.answer]}<\/strong><\/span>`;\n            }\n            feedbackContent.innerHTML = `<strong>Giải thích:<\/strong> ${q.explanation}`;\n        }\n\n        // Chuyển câu trước / sau\n        function prevQuestion() {\n            if(currentIndex > 0) {\n                currentIndex--;\n                loadQuestion(currentIndex);\n            }\n        }\n\n        function nextQuestion() {\n            if(currentIndex < currentQuestions.length - 1) {\n                currentIndex++;\n                loadQuestion(currentIndex);\n            } else {\n                confirmSubmit();\n            }\n        }\n\n        // Modal Xác nhận nộp bài\n        function confirmSubmit() {\n            const answeredCount = Object.keys(userAnswers).length;\n            document.getElementById('confirm-stats-text').innerText = `Bạn đã trả lời ${answeredCount}/${currentQuestions.length} câu hỏi. Sau khi nộp, hệ thống sẽ khóa bài kiểm tra vĩnh viễn (chỉ cho phép làm 1 lượt duy nhất).`;\n            document.getElementById('modal-confirm').classList.remove('hidden');\n        }\n\n        function closeModalConfirm() {\n            document.getElementById('modal-confirm').classList.add('hidden');\n        }\n\n        // Nộp bài chính thức & Chấm điểm theo quy chế mới (Thang điểm chuẩn hệ số giáo dục phổ thông)\n        function submitQuizFinal() {\n            clearInterval(timerInterval);\n            \n            // Đánh dấu đã nộp bài vào localStorage để chặn không cho làm lại lượt thứ 2\n            localStorage.setItem('cog_nghe_8_submitted', 'true');\n\n            document.getElementById('modal-confirm').classList.add('hidden');\n            document.getElementById('screen-quiz').classList.add('hidden');\n            document.getElementById('screen-result').classList.remove('hidden');\n\n            let correctCount = 0;\n            let incorrectCount = 0;\n            let detailHTML = \"\";\n\n            currentQuestions.forEach((q, idx) => {\n                const userChoice = userAnswers[idx];\n                const isCorrect = userChoice === q.answer;\n                if(isCorrect) correctCount++;\n                else incorrectCount++;\n\n                const userText = userChoice !== undefined ? `${String.fromCharCode(65 + userChoice)}. ${q.options[userChoice]}` : '<span class=\"text-amber-400\">Chưa trả lời<\/span>';\n                const correctText = `${String.fromCharCode(65 + q.answer)}. ${q.options[q.answer]}`;\n\n                detailHTML += `\n                    <div class=\"p-2.5 rounded border ${isCorrect ? 'bg-emerald-950/30 border-emerald-800' : 'bg-rose-950/30 border-rose-800'}\">\n                        <div class=\"font-semibold text-white\">Câu ${idx + 1}: ${q.title}<\/div>\n                        <div class=\"mt-1 text-slate-300\">Bạn chọn: <span class=\"${isCorrect ? 'text-emerald-400 font-bold' : 'text-rose-400 font-bold'}\">${userText}<\/span><\/div>\n                        ${!isCorrect ? `<div class=\"text-slate-400\">Đáp án chuẩn: <span class=\"text-emerald-300\">${correctText}<\/span><\/div>` : ''}\n                    <\/div>\n                `;\n            });\n\n            document.getElementById('detail-review-container').innerHTML = detailHTML;\n\n            const total = currentQuestions.length;\n            const percent = Math.round((correctCount / total) * 100);\n            \n            // CÁCH TÍNH ĐIỂM MỚI THEO YÊU CẦU: Thang điểm 10 quy đổi chính xác theo số câu trả lời đúng trên tổng số câu\n            const score10 = ((correctCount / total) * 10).toFixed(2);\n\n            document.getElementById('stat-correct').innerText = `${correctCount}/${total}`;\n            document.getElementById('stat-incorrect').innerText = `${incorrectCount}/${total}`;\n            document.getElementById('stat-percent').innerText = `${percent}%`;\n            document.getElementById('stat-score').innerText = score10;\n\n            document.getElementById('result-student-info').innerText = `Học sinh: ${studentInfo.name} | Lớp: ${studentInfo.class} | Mã đề: ${studentInfo.code}`;\n\n            // Nhận xét khích lệ\n            const commentBox = document.getElementById('result-comment-box');\n            let commentText = \"\";\n            if(percent >= 90) {\n                commentText = `🌟 Xuất sắc! Điểm số ${score10}/10 chứng tỏ em nắm rất vững kiến thức Chương II Cơ khí Công nghệ 8. Hãy tiếp tục phát huy!`;\n            } else if(percent >= 70) {\n                commentText = `👍 Khá tốt! Đạt ${score10}/10 điểm. Em đã hiểu bài và hoàn thành tốt nội dung ôn tập.`;\n            } else if(percent >= 50) {\n                commentText = `💪 Cố gắng lên em! Điểm số là ${score10}/10. Em hãy đọc kỹ lại sách giáo khoa Bài 7, 8, 9 để củng cố thêm kiến thức nhé.`;\n            } else {\n                commentText = `🌱 Cần cố gắng hơn nữa! Điểm số là ${score10}/10. Em hãy kiên nhẫn đọc lại sách giáo khoa Công nghệ 8 trang 34-57.`;\n            }\n            commentBox.innerHTML = `<p class=\"text-amber-300 font-semibold mb-1\">Nhận xét từ giáo viên (Đã ghi nhận kết quả lượt duy nhất):<\/p><p>${commentText}<\/p>`;\n\n            // Hiển thị Giấy chứng nhận nếu đạt trên 70%\n            if(percent >= 70) {\n                document.getElementById('certificate-box').classList.remove('hidden');\n                document.getElementById('cert-name').innerText = studentInfo.name;\n                document.getElementById('cert-class').innerText = studentInfo.class;\n                const today = new Date();\n                document.getElementById('cert-date').innerText = `${today.getDate().toString().padStart(2, '0')}/${(today.getMonth()+1).toString().padStart(2, '0')}/${today.getFullYear()}`;\n            } else {\n                document.getElementById('certificate-box').classList.add('hidden');\n            }\n        }\n\n        // Bật tắt xem chi tiết\n        function toggleDetailReview() {\n            const container = document.getElementById('detail-review-container');\n            const btn = document.getElementById('btn-toggle-review');\n            if(container.classList.contains('hidden')) {\n                container.classList.remove('hidden');\n                btn.innerText = \"Ẩn chi tiết ▴\";\n            } else {\n                container.classList.add('hidden');\n                btn.innerText = \"Xem chi tiết ▾\";\n            }\n        }\n    <\/script>\n<\/body>\n<\/html>" };
const TITLES = { sinh: "Sinh – KHTN 8", cn: "Công Nghệ 8" };

const $ = id => document.getElementById(id);
const show = id => { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); };
const unlocked = () => { try { return localStorage.getItem(STORE) === "1"; } catch (e) { return false; } };

function splash(done) {
  const sp = $('splash');
  sp.classList.remove('out'); sp.classList.add('on');
  setTimeout(() => {
    sp.classList.add('out');
    setTimeout(() => { sp.classList.remove('on', 'out'); done(); }, 350);
  }, 3000);
}

function enter() { splash(() => show('menu')); }

$('gateForm').addEventListener('submit', e => {
  e.preventDefault();
  if ($('key').value.trim() === KEY) {
    try { localStorage.setItem(STORE, "1"); } catch (err) {}
    $('err').textContent = "";
    enter();
  } else {
    $('err').textContent = "Key chưa đúng. Kiểm tra lại chữ hoa, chữ thường.";
    const f = $('gateForm'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
  }
});

document.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => openDoc(b.dataset.open)));

function openDoc(id) {
  let fr = document.getElementById('f-' + id);
  if (!fr) {
    fr = document.createElement('iframe');
    fr.id = 'f-' + id;
    fr.title = TITLES[id];
    fr.srcdoc = DOCS[id];
    $('frames').appendChild(fr);
  }
  document.querySelectorAll('#frames iframe').forEach(x => x.classList.toggle('on', x === fr));
  $('vt').textContent = TITLES[id];
  $('viewer').classList.add('on');
}
$('back').addEventListener('click', () => $('viewer').classList.remove('on'));

if (unlocked()) enter(); else show('gate');
</script>
</body>
</html>
