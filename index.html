<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Web By AzurJ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d1021;--ink2:#171b36;--cobalt:#3347ff;--mint:#7be0b5;--sun:#ffc247;--chalk:#eef0ff;--mute:#9aa0c8;
--display:'Bricolage Grotesque','Be Vietnam Pro',system-ui,sans-serif;--body:'Be Vietnam Pro',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--ink);color:var(--chalk);font-family:var(--body);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.screen{display:none;min-height:100%;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.screen.on{display:flex}
/* khoá key */
.gate{width:100%;max-width:360px}
.gate h1{font-family:var(--display);font-size:34px;font-weight:800;line-height:1.05;margin-bottom:8px}
.gate p{color:var(--mute);font-size:14px;margin-bottom:22px}
.gate input{width:100%;font:inherit;font-size:17px;padding:14px 16px;border-radius:12px;border:2px solid #2a3060;background:var(--ink2);color:var(--chalk);outline:none}
.gate input:focus{border-color:var(--cobalt)}
.gate button{width:100%;margin-top:12px;font:inherit;font-weight:600;font-size:16px;padding:14px;border:0;border-radius:12px;background:var(--cobalt);color:#fff;min-height:48px;cursor:pointer}
.err{color:#ff8f9c;font-size:13px;min-height:20px;margin-top:10px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* splash 3s */
#splash{position:fixed;inset:0;z-index:100;background:var(--cobalt);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;cursor:wait}
#splash.on{display:flex}
#splash .by{font-family:var(--display);font-weight:700;font-size:clamp(22px,5vw,34px);color:#cfd5ff}
#splash .nm{font-family:var(--display);font-weight:800;font-size:clamp(64px,22vw,190px);line-height:.95;color:#fff;letter-spacing:-.03em}
#splash .bar{position:absolute;left:0;bottom:0;height:8px;width:0;background:var(--sun)}
#splash.on .bar{animation:fill 3s linear forwards}
#splash.on .nm{animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes fill{to{width:100%}}
@keyframes pop{from{transform:scale(.8);opacity:0}}
#splash.out{opacity:0;transition:opacity .35s}
/* menu */
.menu{width:100%;max-width:820px}
.menu h2{font-family:var(--display);font-size:30px;font-weight:800;margin-bottom:6px}
.menu .sub{color:var(--mute);font-size:14px;margin-bottom:22px}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
.card{display:block;width:100%;text-align:left;font:inherit;border:0;border-radius:22px;padding:26px 22px;min-height:170px;cursor:pointer;color:var(--ink);position:relative}
.card.sinh{background:var(--mint)}
.card.cn{background:var(--sun)}
.card b{display:block;font-family:var(--display);font-size:38px;font-weight:800;line-height:1}
.card span{display:block;margin-top:10px;font-size:14px;font-weight:500;max-width:22ch}
.card:active{transform:scale(.98)}
.card:focus-visible,.gate button:focus-visible,.back:focus-visible{outline:3px solid #fff;outline-offset:3px}
/* khung làm bài */
#viewer{display:none;position:fixed;inset:0;background:var(--ink);flex-direction:column;padding-top:env(safe-area-inset-top,0)}
#viewer.on{display:flex}
.top{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--ink2)}
.back{font:inherit;font-weight:600;font-size:14px;color:var(--chalk);background:#262c58;border:0;border-radius:10px;padding:10px 14px;min-height:40px;cursor:pointer}
.top .t{font-family:var(--display);font-weight:700;font-size:16px}
#frames{flex:1;position:relative}
#frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
#frames iframe.on{display:block}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#splash.on .bar{width:100%}}
</style>
</head>
<body>

<section class="screen" id="gate">
  <form class="gate" id="gateForm" autocomplete="off">
    <h1>Nhập key để vào</h1>
    <p>Web By AzurJ</p>
    <input id="key" type="password" placeholder="Key" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Key">
    <button type="submit">Vào web</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</section>

<div id="splash" aria-live="polite">
  <div class="by">Web By</div>
  <div class="nm">AzurJ</div>
  <div class="bar"></div>
</div>

<section class="screen" id="menu">
  <div class="menu">
    <h2>Chọn môn</h2>
    <p class="sub">Bấm vào một môn để bắt đầu làm bài.</p>
    <div class="grid">
      <button class="card sinh" data-open="sinh"><b>Sinh</b><span>Đấu trường tri thức KHTN 8: cơ thể người</span></button>
      <button class="card cn" data-open="cn"><b>Công Nghệ</b><span>Chinh phục cơ khí lớp 8, 30 câu, 15 phút</span></button>
    </div>
  </div>
</section>

<div id="viewer">
  <div class="top"><button class="back" id="back">← Về menu</button><span class="t" id="vt"></span></div>
  <div id="frames"></div>
</div>

<script>
const KEY = "CongDai";
const STORE = "azurj_access_v1";
const DOCS = { sinh: "<!DOCTYPE html>\n<html lang=\"vi\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Đấu Trường Tri Thức – Chinh Phục Cơ Thể Người (KHTN 8) - Cô Lê Thủy AI<\/title>\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link href=\"https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap\" rel=\"stylesheet\">\n  <script src=\"https://cdn.tailwindcss.com\"><\/script>\n  <style>\n    body {\n      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;\n    }\n  <\/style>\n<script src=\"/_aistudio-iframe.js?v=1f94f900\"><\/script><\/head>\n<body class=\"bg-slate-950 text-slate-100 min-h-screen selection:bg-cyan-500/30 selection:text-cyan-200\">\n  <div id=\"app\" class=\"flex flex-col min-h-screen\"><\/div>\n\n  <script>\n    // Embedded question bank (31 questions - 40 scoring items - 0.25 pts each = 10.00 pts total)\n    const DEFAULT_QUESTIONS = [\n      // DẠNG 1: TRẮC NGHIỆM 4 LỰA CHỌN (18 CÂU - 0.25Đ/CÂU = 4.50Đ)\n      {\n        id: 1,\n        lessonId: \"bai_30\",\n        lessonName: \"Bài 30: Khái quát về cơ thể người\",\n        type: \"mcq\",\n        question: \"Cơ thể người được bao bọc bởi lớp da và phân chia thành các phần chính nào sau đây?\",\n        options: [\n          { key: \"A\", text: \"Đầu, thân và các chi (tay, chân)\" },\n          { key: \"B\", text: \"Đầu, cổ, ngực và bụng\" },\n          { key: \"C\", text: \"Đầu, ngực, bụng và tứ chi\" },\n          { key: \"D\", text: \"Hộp sọ, lồng ngực và khoang bụng\" }\n        ],\n        correctAnswer: \"A\",\n        points: 0.25,\n        explanation: \"Toàn bộ cơ thể người được bao bọc bởi da, chia làm 3 phần: đầu, thân (gồm lồng ngực và khoang bụng ngăn cách bởi cơ hoành) và các chi (tay, chân).\"\n      },\n      {\n        id: 2,\n        lessonId: \"bai_30\",\n        lessonName: \"Bài 30: Khái quát về cơ thể người\",\n        type: \"mcq\",\n        question: \"Trong cơ thể người, cơ quan nào đóng vai trò là ranh giới ngăn cách giữa khoang ngực và khoang bụng?\",\n        options: [\n          { key: \"A\", text: \"Phổi\" },\n          { key: \"B\", text: \"Cơ hoành\" },\n          { key: \"C\", text: \"Dạ dày\" },\n          { key: \"D\", text: \"Cơ liên sườn\" }\n        ],\n        correctAnswer: \"B\",\n        points: 0.25,\n        explanation: \"Cơ hoành là một tấm cơ vân dẹt ngăn cách khoang ngực ở phía trên và khoang bụng ở phía dưới, đồng thời đóng vai trò quan trọng trong việc hô hấp hít vào và thở ra.\"\n      },\n      {\n        id: 3,\n        lessonId: \"bai_30\",\n        lessonName: \"Bài 30: Khái quát về cơ thể người\",\n        type: \"mcq\",\n        question: \"Hệ cơ quan nào có chức năng vận chuyển chất dinh dưỡng, khí oxygen đến từng tế bào và mang các chất thải, khí carbon dioxide đến cơ quan bài tiết?\",\n        options: [\n          { key: \"A\", text: \"Hệ hô hấp\" },\n          { key: \"B\", text: \"Hệ tiêu hóa\" },\n          { key: \"C\", text: \"Hệ tuần hoàn\" },\n          { key: \"D\", text: \"Hệ nội tiết\" }\n        ],\n        correctAnswer: \"C\",\n        points: 0.25,\n        explanation: \"Hệ tuần hoàn gồm tim và hệ mạch máu (động mạch, mao mạch, tĩnh mạch), có chức năng lưu chuyển máu đi khắp cơ thể để vận chuyển oxy, dinh dưỡng và thu gom chất thải chuyển đến cơ quan bài tiết.\"\n      },\n      {\n        id: 4,\n        lessonId: \"bai_30\",\n        lessonName: \"Bài 30: Khái quát về cơ thể người\",\n        type: \"mcq\",\n        question: \"Khi học sinh chạy nhanh trong giờ Thể dục, nhịp tim đập nhanh hơn, hơi thở dồn dập và mồ hôi toát ra nhiều. Hiện tượng này chứng minh điều gì?\",\n        options: [\n          { key: \"A\", text: \"Các hệ cơ quan hoạt động hoàn toàn biệt lập, không liên quan đến nhau\" },\n          { key: \"B\", text: \"Cơ thể đang rơi vào trạng thái cạn kiệt năng lượng nguy hiểm\" },\n          { key: \"C\", text: \"Các hệ cơ quan phối hợp hoạt động nhịp nhàng dưới sự điều hòa của hệ thần kinh và thể dịch\" },\n          { key: \"D\", text: \"Chỉ có hệ vận động và hệ tuần hoàn hoạt động trong khi các hệ khác tạm ngưng\" }\n        ],\n        correctAnswer: \"C\",\n        points: 0.25,\n        explanation: \"Khi vận động mạnh, hệ vận động đòi hỏi nhiều năng lượng, kích thích hệ tuần hoàn bơm máu nhanh hơn, hệ hô hấp lấy nhiều O2 hơn và tuyến mồ hôi tỏa nhiệt. Tất cả phối hợp thống nhất dưới sự điều hòa của hệ thần kinh và thể dịch.\"\n      },\n      {\n        id: 5,\n        lessonId: \"bai_31\",\n        lessonName: \"Bài 31: Hệ vận động ở người\",\n        type: \"mcq\",\n        question: \"Ở người trưởng thành khỏe mạnh, bộ xương gồm khoảng bao nhiêu chiếc xương?\",\n        options: [\n          { key: \"A\", text: \"106 chiếc xương\" },\n          { key: \"B\", text: \"206 chiếc xương\" },\n          { key: \"C\", text: \"306 chiếc xương\" },\n          { key: \"D\", text: \"406 chiếc xương\" }\n        ],\n        correctAnswer: \"B\",\n        points: 0.25,\n        explanation: \"Bộ xương người trưởng thành gồm khoảng 206 xương với nhiều kích thước và hình dạng khác nhau, chia làm 3 phần: xương đầu, xương thân và xương chi.\"\n      },\n      {\n        id: 6,\n        lessonId: \"bai_31\",\n        lessonName: \"Bài 31: Hệ vận động ở người\",\n        type: \"mcq\",\n        question: \"Khớp giữa các mảnh xương hộp sọ thuộc loại khớp xương nào sau đây?\",\n        options: [\n          { key: \"A\", text: \"Khớp bất động\" },\n          { key: \"B\", text: \"Khớp bán động\" },\n          { key: \"C\", text: \"Khớp động\" },\n          { key: \"D\", text: \"Khớp sụn dẻo\" }\n        ],\n        correctAnswer: \"A\",\n        points: 0.25,\n        explanation: \"Khớp giữa các mảnh xương sọ là khớp bất động, các mép xương có các đường răng cưa gắn kết chặt chẽ cố định với nhau để tạo thành hộp sọ vững chắc bảo vệ não bộ.\"\n      },\n      {\n        id: 7,\n        lessonId: \"bai_31\",\n        lessonName: \"Bài 31: Hệ vận động ở người\",\n        type: \"mcq\",\n        question: \"Hiện tượng cơ bị co cứng đột ngột, không thể chủ động duỗi ra được, gây đau buốt dữ dội khi vận động hoặc bơi lội được gọi là gì?\",\n        options: [\n          { key: \"A\", text: \"Trật khớp xương\" },\n          { key: \"B\", text: \"Chuột rút (vọp bẻ)\" },\n          { key: \"C\", text: \"Bong gân\" },\n          { key: \"D\", text: \"Viêm khớp cấp tính\" }\n        ],\n        correctAnswer: \"B\",\n        points: 0.25,\n        explanation: \"Chuột rút là tình trạng cơ co thắt đột ngột, ngoài ý muốn và không giãn ra được. Nguyên nhân thường do cơ bị mỏi, cơ thể thiếu nước và chất điện giải hoặc không khởi động kỹ trước khi vận động mạnh.\"\n      },\n      {\n        id: 8,\n        lessonId: \"bai_31\",\n        lessonName: \"Bài 31: Hệ vận động ở người\",\n        type: \"mcq\",\n        question: \"Để phòng tránh tật cong vẹo cột sống trong quá trình học tập, hành động nào sau đây là ĐÚNG ĐẮN?\",\n        options: [\n          { key: \"A\", text: \"Tựa sát ngực vào mép bàn và cúi gập cổ gần mặt bàn khi viết\" },\n          { key: \"B\", text: \"Luôn đeo cặp sách lệch hẳn sang một bên vai yêu thích\" },\n          { key: \"C\", text: \"Ngồi học ngay ngắn, giữ lưng thẳng tự nhiên, hai bàn chân đặt bằng phẳng trên sàn\" },\n          { key: \"D\", text: \"Ngồi nghiêng một bên và vắt chéo chân liên tục trong suốt buổi học\" }\n        ],\n        correctAnswer: \"C\",\n        points: 0.25,\n        explanation: \"Tư thế ngồi học chuẩn là lưng thẳng tự nhiên, không tì ngực vào cạnh bàn, khoảng cách mắt đến sách vở 25-30 cm, hai bàn chân đặt bằng phẳng trên sàn và đeo balo đều cả hai vai để tải trọng cân bằng.\"\n      },\n      {\n        id: 9,\n        lessonId: \"bai_31\",\n        lessonName: \"Bài 31: Hệ vận động ở người\",\n        type: \"mcq\",\n        question: \"Khi sơ cứu ban đầu cho một người bạn không may bị gãy xương cẳng tay, nguyên tắc quan trọng hàng đầu là gì?\",\n        options: [\n          { key: \"A\", text: \"Nắn bóp mạnh và kéo thẳng cẳng tay nạn nhân ngay tại chỗ\" },\n          { key: \"B\", text: \"Dùng nẹp cố định tạm thời vị trí gãy bất động trước khi đưa đến cơ sở y tế\" },\n          { key: \"C\", text: \"Chườm túi nóng thật nóng lên vị trí gãy để kích thích lưu thông máu\" },\n          { key: \"D\", text: \"Cho nạn nhân tập cử động bàn tay xem xương có còn cảm giác không\" }\n        ],\n        correctAnswer: \"B\",\n        points: 0.25,\n        explanation: \"Nguyên tắc sơ cứu gãy xương là bất động đoạn xương gãy bằng nẹp chuyên dụng hoặc nẹp tạm thời (thước gỗ, thanh tre) để tránh đầu xương gãy đâm rách mạch máu, cơ và dây thần kinh xung quanh; tuyệt đối không nắn bóp.\"\n      },\n      {\n        id: 10,\n        lessonId: \"bai_32\",\n        lessonName: \"Bài 32: Dinh dưỡng và tiêu hóa ở người\",\n        type: \"mcq\",\n        question: \"Trong nước bọt ở khoang miệng người có chứa loại enzyme tiêu hóa nào sau đây?\",\n        options: [\n          { key: \"A\", text: \"Enzyme Pepsin\" },\n          { key: \"B\", text: \"Enzyme Amylase\" },\n          { key: \"C\", text: \"Enzyme Lipase\" },\n          { key: \"D\", text: \"Enzyme Trypsin\" }\n        ],\n        correctAnswer: \"B\",\n        points: 0.25,\n        explanation: \"Nước bọt chứa enzyme amylase xúc tác quá trình thủy phân một phần tinh bột chín thành đường maltose có vị ngọt nhẹ.\"\n      },\n      {\n        id: 11,\n        lessonId: \"bai_32\",\n        lessonName: \"Bài 32: Dinh dưỡng và tiêu hóa ở người\",\n        type: \"mcq\",\n        question: \"Bộ phận nào trong ống tiêu hóa là nơi diễn ra sự hấp thụ chất dinh dưỡng chủ yếu nhất của cơ thể?\",\n        options: [\n          { key: \"A\", text: \"Dạ dày\" },\n          { key: \"B\", text: \"Ruột già\" },\n          { key: \"C\", text: \"Ruột non\" },\n          { key: \"D\", text: \"Thực quản\" }\n        ],\n        correctAnswer: \"C\",\n        points: 0.25,\n        explanation: \"Ruột non dài và có bề mặt hấp thu cực lớn nhờ các nếp gấp, hàng triệu lông ruột và vi nhung mao cùng mạng mao mạch máu, mao mạch bạch huyết dày đặc, hấp thụ đến hơn 90% chất dinh dưỡng.\"\n      },\n      {\n        id: 12,\n        lessonId: \"bai_32\",\n        lessonName: \"Bài 32: Dinh dưỡng và tiêu hóa ở người\",\n        type: \"mcq\",\n        question: \"Dịch mật do tế bào gan sản sinh và được dự trữ ở túi mật có vai trò chính nào sau đây trong tiêu hóa thức ăn?\",\n        options: [\n          { key: \"A\", text: \"Phân giải protein thành các phân tử amino acid nhỏ\" },\n          { key: \"B\", text: \"Nhũ tương hóa chất béo (lipid) thành các giọt nhỏ để enzyme lipase dễ phân giải\" },\n          { key: \"C\", text: \"Biến đổi tinh bột sống thành đường đơn glucose\" },\n          { key: \"D\", text: \"Tiết acid clohydric (HCl) để diệt vi khuẩn trong thức ăn\" }\n        ],\n        correctAnswer: \"B\",\n        points: 0.25,\n        explanation: \"Dịch mật không chứa enzyme tiêu hóa nhưng có các muối mật giúp nhũ tương hóa lipid (chất béo) thành các hạt mỡ nhỏ li ti, tạo điều kiện thuận lợi cho enzyme lipase của dịch tụy và dịch ruột phân giải.\"\n      },\n      {\n        id: 13,\n        lessonId: \"bai_32\",\n        lessonName: \"Bài 32: Dinh dưỡng và tiêu hóa ở người\",\n        type: \"mcq\",\n        question: \"Nguyên nhân phổ biến hàng đầu gây ra bệnh viêm loét dạ dày – tá tràng ở người là gì?\",\n        options: [\n          { key: \"A\", text: \"Nhiễm vi khuẩn Helicobacter pylori (Hp), thói quen ăn uống thất thường và căng thẳng kéo dài\" },\n          { key: \"B\", text: \"Uống đủ 2 lít nước lọc mỗi ngày và ngủ đúng 8 tiếng\" },\n          { key: \"C\", text: \"Ăn nhiều rau củ quả tươi và tập thể dục buổi sáng\" },\n          { key: \"D\", text: \"Chế độ ăn nhạt và giảm lượng đường tinh luyện\" }\n        ],\n        correctAnswer: \"A\",\n        points: 0.25,\n        explanation: \"Vi khuẩn Hp (Helicobacter pylori), thói quen ăn uống bỏ bữa, thức khuya, stress căng thẳng tinh thần kéo dài, lạm dụng chất cay nóng hoặc thuốc giảm đau là những nguyên nhân chính gây tổn thương niêm mạc dạ dày.\"\n      },\n      {\n        id: 14,\n        lessonId: \"bai_32\",\n        lessonName: \"Bài 32: Dinh dưỡng và tiêu hóa ở người\",\n        type: \"mcq\",\n        question: \"Học sinh A thường xuyên bỏ ăn rau xanh, chỉ ăn đồ chiên rán nhiều dầu mỡ và uống rất ít nước lọc. Tình trạng tiêu hóa học sinh A có nguy cơ cao gặp phải là gì?\",\n        options: [\n          { key: \"A\", text: \"Táo bón\" },\n          { key: \"B\", text: \"Tiêu chảy cấp tính\" },\n          { key: \"C\", text: \"Trào ngược dạ dày do dư kiềm\" },\n          { key: \"D\", text: \"Hạ đường huyết nghiêm trọng\" }\n        ],\n        correctAnswer: \"A\",\n        points: 0.25,\n        explanation: \"Rau xanh và trái cây cung cấp lượng chất xơ dồi dào giúp tăng thể tích phân và kích thích nhu động ruột già. Khi thiếu chất xơ và uống ít nước, phân trở nên khô cứng khó tống xuất ra ngoài, gây nên bệnh táo bón.\"\n      },\n      {\n        id: 15,\n        lessonId: \"bai_33\",\n        lessonName: \"Bài 33: Máu và hệ tuần hoàn ở người\",\n        type: \"mcq\",\n        question: \"Loại tế bào máu nào ở người trưởng thành không có nhân, có hình đĩa lõm hai mặt và chứa huyết sắc tố hemoglobin?\",\n        options: [\n          { key: \"A\", text: \"Bạch cầu trung tính\" },\n          { key: \"B\", text: \"Hồng cầu\" },\n          { key: \"C\", text: \"Tiểu cầu\" },\n          { key: \"D\", text: \"Tế bào lympho\" }\n        ],\n        correctAnswer: \"B\",\n        points: 0.25,\n        explanation: \"Hồng cầu trưởng thành không có nhân, hình đĩa lõm hai mặt giúp tối ưu diện tích tiếp xúc để trao đổi khí, chứa hemoglobin có khả năng kết hợp thuận nghịch với O2 và CO2 để vận chuyển khí.\"\n      },\n      {\n        id: 16,\n        lessonId: \"bai_33\",\n        lessonName: \"Bài 33: Máu và hệ tuần hoàn ở người\",\n        type: \"mcq\",\n        question: \"Khi mạch máu bị rách gây chảy máu, thành phần nào của máu đóng vai trò chủ chốt trong cơ chế đông máu để bịt kín vết thương?\",\n        options: [\n          { key: \"A\", text: \"Hồng cầu\" },\n          { key: \"B\", text: \"Bạch cầu mono\" },\n          { key: \"C\", text: \"Tiểu cầu\" },\n          { key: \"D\", text: \"Huyết tương đơn thuần\" }\n        ],\n        correctAnswer: \"C\",\n        points: 0.25,\n        explanation: \"Tiểu cầu vỡ ra giải phóng enzyme kết hợp với chất trong huyết tương biến fibrinogen thành mạng lưới sợi fibrin, giữ chặt các tế bào máu tạo thành khối máu đông bít kín miệng vết thương để cầm máu.\"\n      },\n      {\n        id: 17,\n        lessonId: \"bai_33\",\n        lessonName: \"Bài 33: Máu và hệ tuần hoàn ở người\",\n        type: \"mcq\",\n        question: \"Trong hệ nhóm máu ABO, người có nhóm máu O sở hữu đặc điểm kháng nguyên và kháng thể như thế nào?\",\n        options: [\n          { key: \"A\", text: \"Màng hồng cầu không có cả kháng nguyên A và B; huyết tương có cả kháng thể α và β\" },\n          { key: \"B\", text: \"Màng hồng cầu có cả kháng nguyên A và B; huyết tương không có kháng thể nào\" },\n          { key: \"C\", text: \"Màng hồng cầu có kháng nguyên A; huyết tương có kháng thể β\" },\n          { key: \"D\", text: \"Màng hồng cầu có kháng nguyên B; huyết tương có kháng thể α\" }\n        ],\n        correctAnswer: \"A\",\n        points: 0.25,\n        explanation: \"Nhóm máu O có màng hồng cầu không mang kháng nguyên A hay B, trong huyết tương chứa cả hai loại kháng thể α và β. Nhờ không mang kháng nguyên A, B nên hồng cầu máu O không bị ngưng kết khi truyền cho các nhóm máu khác theo nguyên tắc an toàn.\"\n      },\n      {\n        id: 18,\n        lessonId: \"bai_33\",\n        lessonName: \"Bài 33: Máu và hệ tuần hoàn ở người\",\n        type: \"mcq\",\n        question: \"Một người trưởng thành khi nghỉ ngơi có chỉ số huyết áp đo được là 155/95 mmHg. Nhận định nào sau đây là CHÍNH XÁC về tình trạng sức khỏe của người này?\",\n        options: [\n          { key: \"A\", text: \"Huyết áp hoàn toàn bình thường, khỏe mạnh lý tưởng\" },\n          { key: \"B\", text: \"Người này bị huyết áp thấp cần ăn mặn hơn ngay lập tức\" },\n          { key: \"C\", text: \"Người này có dấu hiệu tăng huyết áp (cao huyết áp) và cần được bác sĩ thăm khám\" },\n          { key: \"D\", text: \"Đây là tình trạng thiếu máu cục bộ bẩm sinh không đáng lo ngại\" }\n        ],\n        correctAnswer: \"C\",\n        points: 0.25,\n        explanation: \"Chỉ số huyết áp bình thường ở người trưởng thành là từ 90/60 mmHg đến 120/80 mmHg. Chỉ số từ 140/90 mmHg trở lên được chẩn đoán là tăng huyết áp (cao huyết áp), tiềm ẩn nguy cơ đột quỵ và tai biến tim mạch.\"\n      },\n\n      // DẠNG 2: ĐÚNG - SAI (3 CÂU - 12 NHẬN ĐỊNH - 0.25Đ/Ý = 3.00Đ)\n      {\n        id: 19,\n        lessonId: \"bai_30\",\n        lessonName: \"Bài 30: Khái quát về cơ thể người\",\n        type: \"true_false\",\n        question: \"Khi tìm hiểu về cấu tạo và hoạt động khái quát của cơ thể người, các nhận định sau đây là Đúng hay Sai?\",\n        pointsPerStatement: 0.25,\n        statements: [\n          { id: \"a\", text: \"Màng tế bào, tế bào chất và nhân là ba thành phần cơ bản cấu tạo nên tế bào cơ thể người.\", correctAnswer: true, explanation: \"ĐÚNG. Mọi tế bào trong cơ thể người đều có cấu trúc cơ bản gồm màng sinh chất, tế bào chất (chứa các bào quan) và nhân chứa vật chất di truyền DNA.\" },\n          { id: \"b\", text: \"Các cơ quan nằm trong cùng một khoang cơ thể thì nhất thiết phải thuộc cùng một hệ cơ quan duy nhất.\", correctAnswer: false, explanation: \"SAI. Trong một khoang cơ thể có thể chứa nhiều cơ quan của các hệ khác nhau (ví dụ khoang bụng chứa dạ dày, ruột, gan, thận...).\" },\n          { id: \"c\", text: \"Hệ bài tiết nước tiểu gồm các cơ quan: hai quả thận, hai ống dẫn nước tiểu, bóng đái (bàng quang) và ống đái.\", correctAnswer: true, explanation: \"ĐÚNG. Đây là cấu tạo hoàn chỉnh của hệ bài tiết nước tiểu theo SGK KHTN 8.\" },\n          { id: \"d\", text: \"Hệ thần kinh và hệ nội tiết cùng phối hợp điều hòa, phối hợp nhịp nhàng hoạt động của các cơ quan trong cơ thể.\", correctAnswer: true, explanation: \"ĐÚNG. Cơ thể được điều hòa bởi cơ chế thần kinh và cơ chế thể dịch/nội tiết.\" }\n        ],\n        explanation: \"Câu hỏi kiểm tra kiến thức về tế bào, khoang cơ thể và cơ chế điều hòa hoạt động của cơ thể người.\"\n      },\n      {\n        id: 20,\n        lessonId: \"bai_31\",\n        lessonName: \"Bài 31 & Bài 32: Hệ vận động và Tiêu hóa\",\n        type: \"true_false\",\n        question: \"Khi nghiên cứu về hoạt động của hệ vận động và hệ tiêu hóa ở người, mỗi nhận định sau đây là Đúng hay Sai?\",\n        pointsPerStatement: 0.25,\n        statements: [\n          { id: \"a\", text: \"Xương có tính mềm dẻo là nhờ chất khoáng vô cơ, còn có tính bền chắc vững vàng là nhờ chất hữu cơ (cốt giao).\", correctAnswer: false, explanation: \"SAI. Ngược lại: chất cốt giao hữu cơ tạo tính đàn hồi mềm dẻo, muối khoáng canxi vô cơ tạo độ cứng chắc.\" },\n          { id: \"b\", text: \"Tắm nắng hợp lí vào buổi sáng sớm giúp tiền chất dưới da chuyển hóa thành vitamin D, thúc đẩy hấp thụ canxi giúp xương chắc khỏe.\", correctAnswer: true, explanation: \"ĐÚNG. Tia tử ngoại buổi sáng chuyển hóa tiền vitamin D, giúp ruột non hấp thụ canxi phòng loãng xương, còi xương.\" },\n          { id: \"c\", text: \"Tại thực quản của người, thức ăn được tiêu hóa hóa học mạnh mẽ nhờ các enzyme tiết ra từ thành thực quản.\", correctAnswer: false, explanation: \"SAI. Thực quản không tiết enzyme tiêu hóa, chỉ vận chuyển cơ học viên thức ăn từ hầu xuống dạ dày.\" },\n          { id: \"d\", text: \"Chế độ ăn uống cân bằng 4 nhóm chất dinh dưỡng và thói quen ăn chín, uống sôi là giải pháp quan trọng bảo vệ hệ tiêu hóa.\", correctAnswer: true, explanation: \"ĐÚNG. Ăn đủ 4 nhóm chất kết hợp an toàn thực phẩm bảo vệ cơ quan tiêu hóa.\" }\n        ],\n        explanation: \"Câu hỏi phân biệt thành phần xương, vitamin D và chức năng cơ học của thực quản.\"\n      },\n      {\n        id: 21,\n        lessonId: \"bai_33\",\n        lessonName: \"Bài 33: Máu và hệ tuần hoàn ở người\",\n        type: \"true_false\",\n        question: \"Về thành phần của máu và cấu tạo hệ tuần hoàn ở người, mỗi nhận định sau đây là Đúng hay Sai?\",\n        pointsPerStatement: 0.25,\n        statements: [\n          { id: \"a\", text: \"Huyết tương chiếm khoảng 55% thể tích máu, trong đó nước chiếm khoảng 90% thể tích của huyết tương.\", correctAnswer: true, explanation: \"ĐÚNG. Máu gồm huyết tương (~55%) và tế bào máu (~45%). Huyết tương chứa ~90% là nước.\" },\n          { id: \"b\", text: \"Động mạch là mạch máu có lòng rộng nhất, thành rất mỏng và luôn có van một chiều chạy suốt chiều dài mạch.\", correctAnswer: false, explanation: \"SAI. Tĩnh mạch mới có thành mỏng, lòng rộng và có van một chiều ở chi dưới; động mạch thành dày nhiều sợi đàn hồi và không có van dọc thân.\" },\n          { id: \"c\", text: \"Tiêm vaccine kích thích bạch cầu sản sinh kháng thể và tạo tế bào ghi nhớ, giúp cơ thể miễn dịch chủ động với mầm bệnh.\", correctAnswer: true, explanation: \"ĐÚNG. Vaccine kích hoạt cơ chế sinh kháng thể phòng bệnh chủ động.\" },\n          { id: \"d\", text: \"Ở người trưởng thành khỏe mạnh, nhịp tim sinh lý lúc nghỉ ngơi bình thường dao động trong khoảng 60 đến 80 nhịp/phút.\", correctAnswer: true, explanation: \"ĐÚNG. Nhịp tim trung bình sinh lý lúc nghỉ ngơi là khoảng 60 - 80 lần/phút.\" }\n        ],\n        explanation: \"Câu hỏi kiểm tra thành phần máu, cấu tạo hệ mạch, vaccine và nhịp tim bình thường.\"\n      },\n\n      // DẠNG 3: TRẢ LỜI NGẮN (10 CÂU - 0.25Đ/CÂU = 2.50Đ)\n      {\n        id: 22,\n        lessonId: \"bai_30\",\n        lessonName: \"Bài 30: Khái quát về cơ thể người\",\n        type: \"short_answer\",\n        question: \"Đơn vị cấu trúc và chức năng cơ bản nhất của cơ thể con người là gì?\",\n        standardAnswer: \"Tế bào\",\n        acceptedAnswers: [\n          \"tế bào\",\n          \"te bao\",\n          \"tế bào sống\",\n          \"tế bào sinh học\",\n          \"tế bào người\",\n          \"các tế bào\",\n          \"là tế bào\",\n          \"đó là tế bào\",\n          \"chính là tế bào\",\n          \"tebao\",\n          \"cell\",\n          \"tế bào học\"\n        ],\n        points: 0.25,\n        hint: \"Mọi cơ quan đều được cấu tạo từ các đơn vị sống nhỏ này.\",\n        explanation: \"Tế bào là đơn vị cấu trúc và chức năng cơ bản nhất của mọi cơ thể sống.\"\n      },\n      {\n        id: 23,\n        lessonId: \"bai_30\",\n        lessonName: \"Bài 30: Khái quát về cơ thể người\",\n        type: \"short_answer\",\n        question: \"Lồng ngực của cơ thể người được giới hạn bởi các xương sườn, cột sống ở phía sau và xương nào ở chính giữa phía trước ngực?\",\n        standardAnswer: \"Xương ức\",\n        acceptedAnswers: [\"xương ức\", \"xuong uc\", \"ức\"],\n        points: 0.25,\n        hint: \"Xương dẹt phía trước ngực liên kết với các sụn sườn.\",\n        explanation: \"Xương ức nằm ở phía trước ngực, khớp với các đôi xương sườn và cột sống tạo thành lồng ngực.\"\n      },\n      {\n        id: 24,\n        lessonId: \"bai_31\",\n        lessonName: \"Bài 31: Hệ vận động ở người\",\n        type: \"short_answer\",\n        question: \"Xương dài nhất và chịu lực nặng nhất trong toàn bộ hệ xương của con người là xương gì?\",\n        standardAnswer: \"Xương đùi\",\n        acceptedAnswers: [\"xương đùi\", \"xuong dui\", \"đùi\"],\n        points: 0.25,\n        hint: \"Nằm ở chi dưới nối khớp háng với khớp gối.\",\n        explanation: \"Xương đùi là xương dài nhất và chịu lực lớn nhất trong cơ thể người.\"\n      },\n      {\n        id: 25,\n        lessonId: \"bai_31\",\n        lessonName: \"Bài 31: Hệ vận động ở người\",\n        type: \"short_answer\",\n        question: \"Bệnh ở hệ vận động xảy ra do mật độ chất khoáng (đặc biệt là canxi) trong xương bị suy giảm, khiến xương trở nên xốp, giòn và rất dễ gãy được gọi là bệnh gì?\",\n        standardAnswer: \"Loãng xương\",\n        acceptedAnswers: [\"loãng xương\", \"loang xuong\", \"bệnh loãng xương\", \"benh loang xuong\"],\n        points: 0.25,\n        hint: \"Bệnh xốp xương do thiếu hụt canxi.\",\n        explanation: \"Bệnh loãng xương làm suy giảm mật độ khoáng chất của xương khiến xương giòn xốp và dễ gãy.\"\n      },\n      {\n        id: 26,\n        lessonId: \"bai_32\",\n        lessonName: \"Bài 32: Dinh dưỡng và tiêu hóa ở người\",\n        type: \"short_answer\",\n        question: \"Tuyến tiêu hóa lớn nhất trong cơ thể người, có chức năng tiết dịch mật, dự trữ glycogen và khử các chất độc hại là cơ quan nào?\",\n        standardAnswer: \"Gan\",\n        acceptedAnswers: [\"gan\", \"lá gan\", \"tuyến gan\"],\n        points: 0.25,\n        hint: \"Nằm ở hạ sườn phải trong khoang bụng.\",\n        explanation: \"Gan là tuyến tiêu hóa lớn nhất (1,2 - 1,5 kg), tiết dịch mật và khử độc.\"\n      },\n      {\n        id: 27,\n        lessonId: \"bai_32\",\n        lessonName: \"Bài 32: Dinh dưỡng và tiêu hóa ở người\",\n        type: \"short_answer\",\n        question: \"Đoạn đầu tiên của ruột non, có hình chữ C uốn quanh đầu tụy và là nơi tiếp nhận dịch tụy và dịch mật đổ vào có tên gọi là gì?\",\n        standardAnswer: \"Tá tràng\",\n        acceptedAnswers: [\"tá tràng\", \"ta trang\"],\n        points: 0.25,\n        hint: \"Đoạn ruột non nối trực tiếp với môn vị dạ dày.\",\n        explanation: \"Tá tràng dài khoảng 25 cm, hình chữ C, là nơi nhận dịch mật và dịch tụy.\"\n      },\n      {\n        id: 28,\n        lessonId: \"bai_32\",\n        lessonName: \"Bài 32: Dinh dưỡng và tiêu hóa ở người\",\n        type: \"short_answer\",\n        question: \"Thành phần dinh dưỡng nào có nhiều trong rau xanh và vỏ hoa quả, không cung cấp calo nhưng đóng vai trò như 'chiếc chổi quét' làm sạch đường tiêu hóa và chống táo bón?\",\n        standardAnswer: \"Chất xơ\",\n        acceptedAnswers: [\"chất xơ\", \"chat xo\", \"chất xơ thực phẩm\", \"cellulose\"],\n        points: 0.25,\n        hint: \"Thành phần có nhiều trong rau xanh chống táo bón.\",\n        explanation: \"Chất xơ kích thích nhu động ruột già, giữ nước làm mềm phân và phòng ngừa táo bón.\"\n      },\n      {\n        id: 29,\n        lessonId: \"bai_33\",\n        lessonName: \"Bài 33: Máu và hệ tuần hoàn ở người\",\n        type: \"short_answer\",\n        question: \"Trái tim của con người được cấu tạo gồm bao nhiêu ngăn (buồng tim)? (Hãy trả lời bằng một chữ số)\",\n        standardAnswer: \"4\",\n        acceptedAnswers: [\"4\", \"bốn\", \"4 ngăn\", \"bon\", \"4 buồng\"],\n        points: 0.25,\n        hint: \"Gồm 2 tâm nhĩ ở trên và 2 tâm thất ở dưới.\",\n        explanation: \"Tim người gồm 4 ngăn: tâm nhĩ phải, tâm nhĩ trái, tâm thất phải, tâm thất trái.\"\n      },\n      {\n        id: 30,\n        lessonId: \"bai_33\",\n        lessonName: \"Bài 33: Máu và hệ tuần hoàn ở người\",\n        type: \"short_answer\",\n        question: \"Mạch máu lớn nhất cơ thể xuất phát từ tâm thất trái, có nhiệm vụ dẫn dòng máu giàu oxygen đi nuôi tất cả các cơ quan trong vòng tuần hoàn lớn là mạch gì?\",\n        standardAnswer: \"Động mạch chủ\",\n        acceptedAnswers: [\"động mạch chủ\", \"dong mach chu\", \"đmc\"],\n        points: 0.25,\n        hint: \"Cung động mạch chính dẫn máu đỏ tươi đi khắp cơ thể.\",\n        explanation: \"Động mạch chủ là động mạch lớn nhất, xuất phát từ tâm thất trái đưa máu giàu oxy đi nuôi cơ thể.\"\n      },\n      {\n        id: 31,\n        lessonId: \"bai_33\",\n        lessonName: \"Bài 33: Máu và hệ tuần hoàn ở người\",\n        type: \"short_answer\",\n        question: \"Khả năng cơ thể tự nhận biết và tiêu diệt các v et);\n        if (cleanInput === cleanTarget) return true;\n        if (inputNoTone === targetNoTone) return true;\n        if (cleanTarget.length >= 3 && cleanInput.includes(cleanTarget)) return true;\n        if (targetNoTone.length >= 3 && inputNoTone.includes(targetNoTone)) return true;\n      }\n      return false;\n    }\n\n    function formatTime(sec) {\n      const m = Math.floor(sec / 60);\n      const s = Math.floor(sec % 60);\n      return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;\n    }\n\n    function render() {\n      const app = document.getElementById('app');\n      let html = '';\n\n      html += `\n        <header class=\"border-b border-slate-800 bg-slate-950/90 backdrop-blur sticky top-0 z-40\">\n          <div class=\"max-w-6xl mx-auto px-4 py-3 flex items-center justify-between\">\n            <div class=\"flex items-center gap-3 cursor-pointer\" onclick=\"goTo('home')\">\n              <div class=\"w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center font-bold text-white shadow\">🧬<\/div>\n              <div>\n                <div class=\"text-sm sm:text-base font-extrabold text-white flex items-center gap-2\">\n                  <span>ĐẤU TRƯỜNG TRI THỨC<\/span>\n                  <span class=\"text-[11px] px-1.5 py-0.2 rounded bg-cyan-950 border border-cyan-800 text-cyan-300\">KHTN 8<\/span>\n                <\/div>\n                <div class=\"text-xs text-slate-400\">\n                  <span class=\"text-amber-400 font-semibold\">Cô Lê Thủy AI<\/span> · Chinh Phục Cơ Thể Người\n                <\/div>\n              <\/div>\n            <\/div>\n\n            <div class=\"flex items-center gap-2\">\n              <button onclick=\"goTo('leaderboard')\" class=\"text-xs font-semibold px-2.5 py-1.5 rounded-lg border border-amber-500/30 bg-amber-500/10 text-amber-300 hover:bg-amber-500/20\">\n                🏆 Bảng vàng\n              <\/button>\n              <button onclick=\"goTo('          <div class=\"grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 text-left mb-8\">\n            <div class=\"rounded-xl border border-slate-800 bg-slate-900/80 p-3.5\">\n              <div class=\"text-xs font-bold text-cyan-400\">BÀI 30<\/div>\n              <div class=\"text-sm font-bold text-white mb-1\">Khái Quát Cơ Thể<\/div>\n              <p class=\"text-xs text-slate-400\">Cấu tạo tế bào, các khoang cơ thể, các hệ cơ quan và sự phối hợp.<\/p>\n            <\/div>\n            <div class=\"rounded-xl border border-slate-800 bg-slate-900/80 p-3.5\">\n              <div class=\"text-xs font-bold text-blue-400\">BÀI 31<\/div>\n              <div class=\"text-sm font-bold text-white mb-1\">Hệ Vận Động<\/div>\n              <p class=\"text-xs text-slate-400\">Bộ xương (206 xương), cơ, khớp, phòng vẹo cột sống, sơ cứu gãy xương.<\/p>\n            <\/div>\n            <div class=\"rounded-xl border border-slate-800 bg-slate-900/80 p-3.5\">\n              <div class=\"text-xs font-bold text-emerald-400\">BÀI 32<\/div>\n              <div class=\"text-sm font-bold text-white mb-1\">Dinh Dưỡng & Tiêu Hóa<\/div>\n              <p class=\"text-xs text-slate-400\">Các nhóm chất, enzyme, ruột non, gan, phòng đau dạ dày, táo bón.<\/p>\n            <\/div>\n            <div class=\"rounded-xl border border-slate-800 bg-slate-900/80 p-3.5\">\n              <div class=\"text-xs font-bold text-rose-400\">BÀI 33<\/div>\n              <div class=\"text-sm font-bold text-white mb-1\">Máu & Hệ Tuần Hoàn<\/div>\n              <p class=\"text-xs text-slate-400\">Hồng cầu, tiểu cầu, nhóm máu ABO, tim 4 ngăn, huyết áp, miễn dịch.<\/p>\n            <\/div>\n          <\/div>\n\n          <div class=\"flex flex-col sm:flex-row items-center justify-center gap-3\">\n            <button onclick=\"startApp()\" class=\"w-full sm:w-auto px-8 py-4 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 font-extrabold text-white text-base shadow-lg shadow-cyan-500/25 hover:from-cyan-400 e-800 text-blue-300 text-xs font-semibold\">Nhận biết · 20s<\/span>';\n        else if (q.level === 'thong_hieu') levelBadge = '<span class=\"px-2 py-0.5 rounded bg-emerald-950 border border-emerald-800 text-emerald-300 text-xs font-semibold\">Thông hiểu · 25s<\/span>';\n        else levelBadge = '<span class=\"px-2 py-0.5 rounded bg-amber-950 border border-amber-800 text-amber-300 text-xs font-semibold\">Vận dụng · 30s<\/span>';\n      }\n\n      return `\n        <div class=\"flex-1 max-w-3xl mx-auto px-4 py-6 w-full\">\n          <div class=\"rounded-2xl border border-slate-800 bg-slate-900 p-4 mb-4 shadow\">\n            <div class=\"flex justify-between items-center text-xs text-slate-300 mb-2\">\n              <span class=\"font-bold text-white\">${state.student.fullName} (Lớp ${state.student.className})<\/span>\n              <div class=\"flex items-center gap-3 font-mono\">\n                <span id=\"questionTimerDisplay\" class=\"${state.questionTimer <= 5 ? 'text-rose-400 font-bold animate-pulse' : 'text-slate-300'}\">⏱️ ${state.questionTimer}s<\/span>\n                <span class=\"text-amber-400 font-bold\">⭐ ${state.currentPoints.toFixed(2)}đ<\/span>\n              <\/div>\n            <\/div>\n            <div class=\"flex justify-between text-xs text-slate-400 mb-1\">\n              <span>Câu ${state.currentIndex + 1} / ${QUESTIONS.length}<\/span>\n              <span>${progress}% hoàn thành<\/span>\n            <\/div>\n            <div class=\"h-2 w-full bg-slate-800 rounded-full overflow-hidden\">\n              <div class=\"h-full bg-cyan-500 transition-all duration-300\" style=\"width: ${progress}%\"><\/div>\n            <\/div>\n          <\/div>\n\n          <div class=\"rounded-2xl border border-slate-800 bg-slate-900 p-6 shadow-xl mb-4\">\n            <div class=\"flex flex-wrap justify-between items-center gap-2 mb-3\">\n              <div class=\"flex flex-wrap items-center gap-2\">${typeBadge}${levelBadge}<\/div>\n              <span class=\"text-xs text-slate-400\">${q.lessonName}<\/span>\n            <\/div>\n\n            <h3 class=\"text-base sm:text-lg font-bold text-white mb-6 leading-relaxed\">\n              <span class=\"text-cyan-400\">Câu ${q.id}:<\/span> ${q.question}\n            <\/h3>\n\n            ${q.type === 'mcq' ? renderMCQOptions(q) : ''}\n            ${q.type === 'true_false' ? renderTFStatements(q) : ''}\n            ${q.type === 'short_answer' ? renderShortAnswerInput(q) : ''}\n\n            <div class=\"pt-4 border-t border-slate-800 flex flex-col sm:flex-row justify-between items-center gap-3\">\n              <div>\n                ${!state.isSubmitted ? '<span class=\"text-xs text-slate-400\">Chọn hoặc nhập đáp án rồi bấm xác nhận<\/span>' : (\n                  state.feedback?.isFullyCorrect\n                    ? '<span class=\"text-xs font-bold text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded\">✓ CHÍNH XÁC (+' + state.feedback.earned.toFixed(2) + 'đ)<\/span>'\n                    : '<span class=\"text-xs font-bold text-rose-400 bg-rose-500/10 px-2.5 py-1 rounded\">✗ CHƯA CHÍNH XÁC (+' + (state.feedback?.earned || 0).toFixed(2) + 'đ)<\/span>'\n                )}\n              <\/div>\n              <div>\n                ${!state.isSubmitted ? `\n                  <button id=\"submitBtn\" onclick=\"submitCurrentAnswer()\" ${canSubmit() ? '' : 'disabled'} class=\"px-6 py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 disabled:opacity-40 font-bold text-xs text-slate-950 min-h-[44px]\">\n                    XÁC NHẬN CÂU TRẢ LỜI\n                  <\/button>\n                ` : `\n                  <button onclick=\"nextQuestion()\" class=\"px-6 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 font-bold text-xs text-slate-950 min-h-[44px]\">\n                    ${state.currentIndex < QUESTIONS.length - 1 ? 'CÂU TIẾP THEO ➔' : 'XEM KẾT QUẢ ➔'}\n                  <\/button>\n                `}\n              <\/div>\n            <\/div>\n\n            ${state.isSubmitted ? `\n              <div class=\"mt-4 rounded-xl border border-cyan-500/30 bg-cyan-950/30 p-3.5 text-xs text-slate-300\">\n                <strong class=\"text-cyan-400\">💡 Giải thích khoa học: <\/strong> ${q.explanation}\n                ${q.type === 'short_answer' ? '<div class=\"mt-1 text-amber-300\"><strong>Đáp án chuẩn:<\/strong> ' + q.standardAnswer + '<\/div>' : ''}\n              <\/div>\n            ` : ''}\n          <\/div>\n        <\/div>\n      `;\n    }\n\n    function renderMCQOptions(q) {\n      let str = '<div class=\"space-y-2.5 mb-6\">';\n      q.options.forEach(opt => {\n        const isSel = state.selectedMCQ === opt.key;\n        const isRight = q.correctAnswer === opt.key;\n        let cls = 'border-slate-800 bg-slate-950/70 hover:border-slate-700 text-slate-200';\n        if (isSel && !state.isSubmitted) {\n          cls = 'border-cyan-500 bg-cyan-950/40 text-white';\n        } else if (state.isSubmitted) {\n          if (isRight) cls = 'border-emerald-500 bg-emerald-950/50 text-emerald-200';\n          else if (isSel && !isRight) cls = 'border-rose-500 bg-rose-950/50 text-rose-200';\n          else cls = 'border-slate-800/50 bg-slate-950/30 text-slate-500 opacity-60';\n        }\n\n        str += `\n          <button type=\"button\" ${state.isSubmitted ? 'disabled' : ''} onclick=\"selectMCQ('${opt.key}')\" class=\"w-full text-left flex items-start gap-3 rounded-xl border p-3.5 transition ${cls}\">\n            <span class=\"w-6 h-6 rounded bg-slate-800 flex items-center justify-center font-bold text-xs shrink-0\">${opt.key}<\/span>\n            <span class=\"text-sm pt-0.5\">${opt.text}<\/span>\n          <\/button>\n        `;\n      });\n      str += '<\/div>';\n      return str;\n    }\n\n    function renderTFStatements(q) {\n      let str = '<div class=\"space-y-3 mb-6\">';\n      q.statements.forEach(st => {\n        const userChoice = state.tfSelections[st.id];\n        str += `\n          <div class=\"rounded-xl border border-slate-800 bg-slate-950/60 p-3.5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3\">\n            <div class=\"text-xs sm:text-sm text-slate-200 flex-1\">\n              <strong class=\"text-amber-400 mr-1\">${st.id})<\/strong> ${st.text}\n            <\/div>\n            <div class=\"flex items-center gap-2 shrink-0\">\n              <button type=\"button\" ${state.isSubmitted ? 'disabled' : ''} onclick=\"setTF('${st.id}', true)\" class=\"px-3 py-1 rounded text-xs font-bold ${userChoice === true ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-slate-300'}\">ĐÚNG<\/button>\n              <button type=\"button\" ${state.isSubmitted ? 'disabled' : ''} onclick=\"setTF('${st.id}', false)\" class=\"px-3 py-1 rounded text-xs font-bold ${userChoice === false ? 'bg-rose-500 text-white' : 'bg-slate-800 text-slate-300'}\">SAI<\/button>\n            <\/div>\n          <\/div>\n        `;\n      });\n      str += '<\/div>';\n      return str;\n    }\n\n    function handleShortInput(val) {\n      state.shortInput = val;\n      const btn = document.getElementById('submitBtn');\n      if (btn && !state.isSubmitted) {\n        btn.disabled = val.trim().length === 0;\n      }\n    }\n\n    function quickFillShort(word) {\n      state.shortInput = word;\n      const inp = document.getElementById('shortAnsInput');\n      if (inp) {\n        inp.value = word;\n        inp.focus();\n      }\n      const btn = document.getElementById('submitBtn');\n      if (btn && !state.isSubmitted) {\n        btn.disabled = false;\n      }\n    }\n\n    function clearShortInput() {\n      state.shortInput = '';\n      const inp = document.getElementById('shortAnsInput');\n      if (inp) {\n        inp.value = '';\n        inp.focus();\n      }\n      const btn = document.getElementById('submitBtn');\n      if (btn && !state.isSubmitted) {\n        btn.disabled = true;\n      }\n    }\n\n    function renderShortAnswerInput(q) {\n      return `\n        <div class=\"mb-6\">\ Map[k].total += 1;\n            if (ans.isFullyCorrect) lessonMap[k].correct += 1;\n          } else if (q.type === 'true_false') {\n            (q.statements || []).forEach(st => {\n              lessonMap[k].total += 1;\n              if (ans.tfAnswers && ans.tfAnswers[st.id] === st.correctAnswer) lessonMap[k].correct += 1;\n            });\n          } else if (q.type === 'short_answer') {\n            lessonMap[k].total += 1;\n            if (ans.isFullyCorrect) lessonMap[k].correct += 1;\n          }\n        });\n      });\n\n      const headers = ['Mã bài', 'Tên bài học', 'Tổng số ý hỏi', 'Số ý đúng', 'Tỉ lệ làm đúng (%)'];\n      const rows = Object.keys(lessonMap).map(k => {\n        const item = lessonMap[k];\n        const pct = item.total > 0 ? Math.round((item.correct / item.total) * 100) : 0;\n        return [k, '\"' + item.name + '\"', item.total, item.correct, pct + '%'].join(',');\n      });\n\n      const content = '\\uFEFF' + ['BÁO CÁO THỐNG KÊ KẾT QUẢ KHTN 8 THEO BÀI HỌC', headers.join(','), ...rows].join('\\r\\n');\n      const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });\n      const url = URL.createObjectURL(blob);\n      const a = document.createElement('a');\n      a.href = url;\n      a.download = 'Thong_ke_chuyen_de_bai_hoc_KHTN8.csv';\n      a.click();\n    }\n\n    function exportCSV() {\n      const sorted = [...state.attempts].sort((a,b) => b.totalScore !== a.totalScore ? b.totalScore - a.totalScore : a.totalDurationSeconds - b.totalDurationSeconds);\n      const headers = ['Hạng', 'Họ và tên', 'Lớp', 'Mã số HS', 'Điểm (/10)', 'Thời gian'];\n      const rows = sorted.map((a, i) => [\n        i + 1,\n        '\"' + a.student.fullName + '\"',\n        '\"' + a.student.className + '\"',\n        '\"' + a.student.studentId + '\"',\n        a.totalScore.toFixed(2),\n        '\"' + formatTime(a.totalDurationSeconds) + '\"'\n      ].join(','));\n      const content = '\\uFEFF' + [headers.join(','), ...rows].join('\\r\\n');\n      const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });\n      const url = URL.createObjectURL(blob);\n      const a = document.createElement('a');\n      a.href = url;\n      a.download = 'Ket_qua_KHTN8_Dau_truong_tri_thuc.csv';\n      a.click();\n    }\n\n    function exportClassReport() {\n      const classMap = {};\n      state.attempts.forEach(a => {\n        const c = a.student.className || 'Chưa rõ';\n        if (!classMap[c]) classMap[c] = [];\n        classMap[c].push(a);\n      });\n      const headers = ['Lớp', 'Sĩ số', 'Điểm TB', 'Cao nhất', 'Thấp nhất'];\n      const rows = Object.keys(classMap).sort().map(cls => {\n        const list = classMap[cls];\n        const scores = list.map(x => x.totalScore);\n        const avg = (scores.reduce((a,b)=>a+b, 0) / list.length).toFixed(2);\n        const max = Math.max(...scores).toFixed(2);\n        const min = Math.min(...scores).toFixed(2);\n        return [cls, list.length, avg, max, min].join(',');\n      });\n      const content = '\\uFEFF' + ['BÁO CÁO KẾT QUẢ KHTN 8 THEO LỚP', headers.join(','), ...rows].join('\\r\\n');\n      const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });\n      const url = URL.createObjectURL(blob);\n      const a = document.createElement('a');\n      a.href = url;\n      a.download = 'Bao_cao_theo_lop_KHTN8.csv';\n      a.click();\n    }\n\n    function export10DayReport() {\n      const now = new Date();\n      const cutoff10 = now.getTime() - 10 * 24 * 60 * 60 * 1000;\n      const attempts10Days = state.attempts.filter(a => {\n        const t = new Date(a.completedAt || Date.now()).getTime();\n        return !isNaN(t) && t >= cutoff10;\n      });\n\n      const dayNames = ['Chủ Nhật', 'Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7'];\n      const daily10 = [];\n      for (let i = 9; i >= 0; i--) {\n        const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);\n        const yyyy = d.getFullYear();\n        const mm = String(d.getMonth() + 1).padStart(2, '0');\n        const dd = String(d.getDate()).padStart(2, '0');\n        const dateStr = `${yyyy}-${mm}-${dd}`;\n        const displayDate = `${dd}/${mm}/${yyyy}`;\n        const dayOfWeek = dayNames[d.getDay()];\n\n        const list = state.attempts.filter(a => {\n          const at = new Date(a.completedAt || Date.now());\n          const aY = at.getFullYear();\n          const aM = String(at.getMonth() + 1).padStart(2, '0');\n          const aD = String(at.getDate()).padStart(2, '0');\n          return `${aY}-${aM}-${aD}` === dateStr;\n        });\n\n        const scores = list.map(x => x.totalScore);\n        const avg = scores.length > 0 ? (scores.reduce((sum, s) => sum + s, 0) / scores.length).toFixed(2) : '0.00';\n        const max = scores.length > 0 ? Math.max(...scores).toFixed(2) : '0.00';\n        const min = scores.length > 0 ? Math.min(...scores).toFixed(2) : '0.00';\n        const passed = scores.filter(s => s >= 5.0).length;\n        const passRate = scores.length > 0 ? Math.round((passed / scores.length) * 100) : 0;\n\n        daily10.push({ dateStr, displayDate, dayOfWeek, count: list.length, avg, max, min, passed, passRate });\n      }\n\n      const sumHeaders = ['Ngày', 'Thứ', 'Số lượt thi', 'Điểm TB (/10)', 'Cao nhất', 'Thấp nhất', 'Số bài đạt (>=5đ)', 'Tỉ lệ đạt'];\n      const sumRows = daily10.map(d => [\n        '\"' + d.displayDate + '\"',\n        '\"' + d.dayOfWeek + '\"',\n        d.count,\n        d.avg,\n        d.max,\n        d.min,\n        d.passed,\n        d.passRate + '%'\n      ].join(','));\n\n      const detailHeaders = ['Thời gian nộp bài', 'Lớp', 'Họ và tên', 'Mã số HS', 'Điểm (/10)', 'Thời gian làm bài', 'Xếp loại'];\n      const detailRows = attempts10Days.map(a => {\n        let rank = 'Chưa đạt';\n        if (a.totalScore >= 8.0) rank = 'Giỏi / Xuất sắc';\n        else if (a.totalScore >= 6.5) rank = 'Khá';\n        else if (a.totalScore >= 5.0) rank = 'Đạt';\n        return [\n          '\"' + new Date(a.completedAt || Date.now()).toLocaleString('vi-VN') + '\"',\n          '\"' + a.student.className + '\"',\n          '\"' + a.student.fullName + '\"',\n          '\"' + a.student.studentId + '\"',\n          a.totalScore.toFixed(2),\n          '\"' + formatTime(a.totalDurationSeconds) + '\"',\n          '\"' + rank + '\"'\n        ].join(',');\n      });\n\n      const fullContent = '\\uFEFF' + [\n        'BÁO CÁO THỐNG KÊ KẾT QUẢ KHTN 8 TRONG 10 NGÀY - CÔ LÊ THỦY AI',\n        'Ngày xuất: ' + new Date().toLocaleString('vi-VN'),\n        'Tổng số lượt thi trong 10 ngày: ' + attempts10Days.length,\n        '',\n        'I. BẢNG TỔNG HỢP THEO NGÀY TRONG 10 NGÀY GẦN NHẤT',\n        sumHeaders.join(','),\n        ...sumRows,\n        '',\n        '',\n        'II. CHI TIẾT TỪNG LƯỢT THI TRONG 10 NGÀY',\n        detailHeaders.join(','),\n        ...detailRows\n      ].join('\\r\\n');\n\n      const blob = new Blob([fullContent], { type: 'text/csv;charset=utf-8;' });\n      const url = URL.createObjectURL(blob);\n      const a = document.createElement('a');\n      a.href = url;\n      a.download = 'Bao_cao_KHTN8_10_ngay_' + new Date().toISOString().slice(0, 10) + '.csv';\n      a.click();\n    }\n\n    function clearData() {\n      if (confirm('Xác nhận xóa toàn bộ danh sách kết quả học sinh?')) {\n        state.attempts = [];\n        localStorage.removeItem('khtn8_quiz_attempts_v1');\n        render();\n      }\n    }\n\n    render();\n  <\/script>\n<\/body>\n<\/html>\n", cn: "<!DOCTYPE html>\n<html lang=\"vi\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Quiz 4 Đáp án - Chinh phục Cơ khí lớp 8<\/title>\n    <\!-- Tailwind CSS CDN -->\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\n    <\!-- Google Fonts Inter & Playfair Display (cho phong cách thư pháp/tiêu đề) -->\n    <link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;60
